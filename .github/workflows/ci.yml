name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Browser-half load test
        run: node test/client-load.e2e.mjs
      - name: Package contents
        run: npm pack --dry-run
